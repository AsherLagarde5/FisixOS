[package]
name = "reterm-installer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ReTermSetup"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
serde_json = "1"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
