[package]
name = "reterm-compmaker-gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ReTermCompMakerGui"
path = "src/main.rs"

[dependencies]
aes = "=0.8.4"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
hmac = "=0.12.1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
zip = { version = "=0.6.6", default-features = false, features = ["aes-crypto", "deflate"] }
